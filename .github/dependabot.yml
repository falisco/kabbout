version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # git flow: updates meet on develop, main only receives releases
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        update-types: [minor, patch]
    ignore:
      # the types follow the Node version the project runs on (.nvmrc), not the latest one
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # a new major of the compiler is taken on purpose, with the lint plugin that supports it
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
