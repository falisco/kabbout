<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; style-src-attr 'unsafe-inline'; object-src 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kabbout — belote contrée</title>
<meta name="description" content="Kabbout : la belote contrée comme au café, à quatre, avec trois habitués à votre table. Huit plis, pas un de moins.">
<meta name="theme-color" content="#0b1c36">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="brand/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="top">
    <button id="scoreBox" class="score" title="Feuille de marque" data-i18n-tooltip="scoreTitle">
      <span class="sr-only" data-i18n="scoreAria">Score, ouvrir la feuille de marque</span>
      <span class="col us"><span class="lbl" data-i18n="us">Nous</span><span class="val" id="sUs">0</span></span>
      <span class="col them"><span class="lbl" data-i18n="them">Eux</span><span class="val" id="sThem">0</span></span>
      <span class="col tgt"><span class="lbl" data-i18n="target">Objectif</span><span class="val small" id="sTgt">1000</span></span>
    </button>
    <div id="contract"></div>
    <div class="icons">
      <button class="ib" id="bLast" title="Pli précédent et enchères" aria-label="Pli précédent et enchères" data-i18n-title="lastTitle"><svg viewBox="0 0 24 24"><rect x="7" y="3" width="11" height="15" rx="2"/><path d="M4 7v11a3 3 0 0 0 3 3h8"/></svg></button>
      <button class="ib" id="bRules" title="Règles" aria-label="Règles" data-i18n-title="rules"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M9 8h6M9 12h5"/></svg></button>
      <button class="ib" id="bSettings" title="Paramètres" aria-label="Paramètres" data-i18n-title="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
      <button class="ib" id="bMenu" title="Menu" aria-label="Menu" data-i18n-title="menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </header>
  <main id="table">
    <div id="tstar"></div>
    <div class="seat n" id="seat2"></div>
    <div class="seat w" id="seat3"></div>
    <div class="seat e" id="seat1"></div>
    <div class="seat s" id="seat0"></div>
    <div id="trick"></div>
    <div id="bid" hidden></div>
    <div id="hint"></div>
    <button id="undoBtn" hidden></button>
    <button id="tipBtn" hidden data-i18n="tip">Conseil</button>
    <button id="chatBtn" class="ib" aria-haspopup="true" aria-expanded="false" aria-controls="chatMenu" title="Phrases rapides" aria-label="Phrases rapides" data-i18n-title="chat"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
    <div id="chatMenu" hidden></div>
    <button id="valBtn" class="ib" title="Valeur des cartes" data-i18n-tooltip="cardValues"><span data-i18n="pts">pts</span><span class="sr-only" data-i18n="cardValues">Valeur des cartes</span></button>
    <div id="coach" hidden role="status"></div>
    <div id="hand"></div>
    <div id="toast" hidden role="status"></div>
  </main>
</div>
<div id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="kabbout" hidden role="button" tabindex="-1"></div>
<div id="sr" class="sr-only" aria-live="polite"></div>

<script src="sounds.js"></script>
<script src="app.js"></script>
</body>
</html>
